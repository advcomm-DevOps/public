name: Deploy Public Content

on:
  push:
    branches: [main]
    paths:
      - '.well-known/**'
      - 'index.html'
      - 'privacy.html'
      - 'ToS.html'
      - 'delete-account.html'
      - 'EULA.html'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Upload Files to Server
        run: |
          echo "=== Uploading .well-known files ==="
          scp -i ~/.ssh/id_rsa -r .well-known root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "=== Uploading index.html ==="
          scp -i ~/.ssh/id_rsa index.html root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "=== Uploading privacy.html ==="
          scp -i ~/.ssh/id_rsa privacy.html root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "=== Uploading ToS.html ==="
          scp -i ~/.ssh/id_rsa ToS.html root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "=== Uploading delete-account.html ==="
          scp -i ~/.ssh/id_rsa delete-account.html root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "=== Uploading EULA.html ==="
          scp -i ~/.ssh/id_rsa EULA.html root@${{ secrets.SERVER_HOST }}:/var/www/public.scomm.ai/

          echo "✅ Files uploaded to server"

      - name: Copy Files to NGINX Root
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "=== Copying files to NGINX root ==="
          cp -v /var/www/public.scomm.ai/.well-known/* /usr/share/nginx/html/.well-known/
          cp -v /var/www/public.scomm.ai/index.html /usr/share/nginx/html/
          cp -v /var/www/public.scomm.ai/privacy.html /usr/share/nginx/html/
          cp -v /var/www/public.scomm.ai/ToS.html /usr/share/nginx/html/
          cp -v /var/www/public.scomm.ai/delete-account.html /usr/share/nginx/html/
          cp -v /var/www/public.scomm.ai/EULA.html /usr/share/nginx/html/
          echo "✅ Files copied to NGINX root"
          EOF

      - name: Verify Files on Server
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "=== Files in NGINX root ==="
          ls -lh /usr/share/nginx/html/ | grep -E "index|privacy|ToS|delete-account|EULA|well-known"
          EOF

      - name: Reload NGINX
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "=== Reloading NGINX ==="
          systemctl reload nginx
          echo "✅ NGINX reloaded successfully"
          EOF

      - name: Health Check - Well-Known Endpoints
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "=== Testing .well-known endpoints ==="
          echo "Testing assetlinks.json..."
          curl -s -I https://public.scomm.ai/.well-known/assetlinks.json | head -1

          echo "Testing apple-app-site-association..."
          curl -s -I https://public.scomm.ai/.well-known/apple-app-site-association | head -1
          EOF

      - name: Health Check - HTML Pages
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
          echo "=== Testing HTML pages ==="

          echo "Testing index.html..."
          curl -s -I https://public.scomm.ai/index.html | head -1

          echo "Testing privacy.html..."
          curl -s -I https://public.scomm.ai/privacy.html | head -1

          echo "Testing EULA.html..."
          curl -s -I https://public.scomm.ai/EULA.html | head -1

          echo "Testing ToS.html..."
          curl -s -I https://public.scomm.ai/ToS.html | head -1

          echo "Testing delete-account.html..."
          curl -s -I https://public.scomm.ai/delete-account.html | head -1
          EOF

      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo ""
          echo "Deployed files:"
          echo "  - .well-known/assetlinks.json"
          echo "  - .well-known/apple-app-site-association"
          echo "  - index.html"
          echo "  - privacy.html"
          echo "  - EULA.html"
          echo "  - ToS.html"
          echo "  - delete-account.html"
          echo ""
          echo "All files are live at: https://public.scomm.ai/"

      - name: Cleanup
        run: rm -f ~/.ssh/id_rsa
